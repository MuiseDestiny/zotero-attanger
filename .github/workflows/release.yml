name: Release

on:
  push:
    tags:
      - v**

permissions:
  contents: write

jobs:
  release-it:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GitHub_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
          # cache: npm

      - name: Install deps
        run: >-
          npm install
          --legacy-peer-deps
          --no-audit
          --no-fund
          --fetch-retries=5
          --fetch-retry-mintimeout=1000
          --fetch-retry-maxtimeout=30000

      - name: Build XPI
        run: npm run build

      - name: Find release notes
        id: notes
        run: |
          notes=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then echo "path=$notes" >> "$GITHUB_OUTPUT"; fi

      - name: Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: build/zotero-attanger.xpi
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: true
